[workspace]
members = ["crates/rini-animation", "crates/rini-cli", "crates/rini-config", "crates/rini-core", "crates/rini-displays", "crates/rini-geometry", "crates/rini-input", "crates/rini-ipc", "crates/rini-mach-sys", "crates/rini-runloop", "crates/rini-skylight-sys", "crates/rini-tiling", "crates/rini-windows", "crates/rini-wm", "crates/rini-workspaces"]
resolver = "3"

[workspace.dependencies]
crossbeam-channel = "0.5"
dashmap = "6.1.0"
slotmap = { version = "1.0.7", features = ["serde"], default-features = false }
enum_dispatch = "0.3.13"
dirs = "6.0.0"
toml = { version = "0.9.2", features = ["display", "parse", "serde"], default-features = false }
notify = { version = "8.2.0", default-features = false }
notify-debouncer-mini = { version = "0.7.0", default-features = false }
strum = { version = "0.27.2", default-features = false, features = ["derive"] }
strum_macros = "0.27.2"
regex = "1.11.0"
thiserror = { version = "2.0.17", default-features = false }
tokio-util = "0.7.15"
tempfile = { version = "3.17.1", default-features = false }
anyhow = { version = "1.0.83", default-features = false }
bitflags = "2.4.1"
clap = { version = "4.5.4", features = ["derive"] }
dispatchr = { git = "https://github.com/drewcrawford/dispatchr" }
nix = { version = "0.30.1", features = ["process", "user"] }
objc2 = { version = "0.6.2", default-features = false, features = ["exception"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
	"NSAlert",
	"NSAppearance",
	"NSApplication",
	"NSAttributedString",
	"NSButton",
	"NSColor",
	"NSControl",
	"NSCell",
	"NSCursor",
	"NSEvent",
	"NSFont",
	"NSGraphics",
	"NSGraphicsContext",
	"NSImage",
	"NSMenu",
	"NSMenuItem",
	"NSOpenPanel",
	"NSPanel",
	"NSStringDrawing",
	"NSResponder",
	"NSRunningApplication",
	"NSSavePanel",
	"NSScreen",
	"NSStatusBar",
	"NSStatusBarButton",
	"NSStatusItem",
	"NSTouch",
	"NSView",
	"NSWindow",
	"NSWorkspace",
	"NSTextField",
	"NSText",
	"libc",
	"objc2-core-foundation",
	"objc2-core-graphics",
	"objc2-quartz-core"
]}
objc2-application-services = { version = "0.3.2", default-features = false, features = [
	"AXError",
	"AXUIElement",
	"AXValue",
	"HIServices",
	"libc"
]}
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
	"CFArray",
	"CFAttributedString",
	"CFMachPort",
	"CFNumber",
	"CFRunLoop",
	"CFString"
]}
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
	"CGColor",
	# CGDataProvider and CGImage let a test build a 1x1 bitmap. The alternative was a real IOSurface,
	# which raced SkyLight's lazy init from test threads and aborted the suite intermittently.
	"CGDataProvider",
	"CGDirectDisplay",
	"CGImage",
	"CGError",
	# CGBitmapContext + CGContext copy the harvested hairline ring out of a framed capture.
	"CGBitmapContext",
	"CGContext",
	"CGColorSpace",
	# CGPath gives the animation tiles a rounded-rect shadow silhouette.
	"CGPath",
	"CGEvent",
	"CGEventSource",
	"CGEventTypes",
	"CGRemoteOperation",
	"CGWindow",
	"libc",
	"objc2"
]}
objc2-foundation = { version = "0.3.2", default-features = false, features = [
	"NSArray",
	"NSDictionary",
	"NSEnumerator",
	"NSAttributedString",
	"NSDistributedNotificationCenter",
	# NSGeometry plus objc2-core-foundation gate NSValue::valueWithPoint, which is how a CGPoint is
	# handed to a CABasicAnimation's from/to values for the Core Animation-driven canvas movement.
	"NSGeometry",
	"NSString",
	"NSKeyValueCoding",
	"NSNotification",
	"NSError",
	"NSProcessInfo",
	"NSURL",
	"NSValue",
	"objc2-core-foundation"
]}
once_cell = { version = "1.21.3", default-features = false }
parking_lot = "0.12"
ron = "0.11.0"
serde = { version = "1.0.201", default-features = false }
serde_json = "1.0.145"
sigpipe = "0.1.3"
serde_with = "3.9.0"
static_assertions = "1.1.0"
tokio = { version = "1.35.1", features = ["libc", "macros"] }
tokio-stream = "0.1.16"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["std", "tracing", "env-filter"], default-features = false }
tracing-timing = "0.7.0"
tracing-tree = { version = "0.4.0", features = ["time"], default-features = false }
futures-task = { version = "0.3.31", features = ["alloc"], default-features = false }
num_enum = "0.7.4"
rustc-hash = "2.1.1"
rini-geometry = { path = "crates/rini-geometry" }
rini-config = { path = "crates/rini-config" }
rini-core = { path = "crates/rini-core" }
rini-displays = { path = "crates/rini-displays" }
rini-input = { path = "crates/rini-input" }
rini-ipc = { path = "crates/rini-ipc" }
rini-animation = { path = "crates/rini-animation" }
rini-mach-sys = { path = "crates/rini-mach-sys" }
rini-runloop = { path = "crates/rini-runloop" }
rini-skylight-sys = { path = "crates/rini-skylight-sys" }
rini-tiling = { path = "crates/rini-tiling" }
rini-windows = { path = "crates/rini-windows" }
rini-workspaces = { path = "crates/rini-workspaces" }
libc = "0.2"
continue = { git = "https://github.com/drewcrawford/continue" }
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
	"CMSampleBuffer",
	"objc2-core-video",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
	# CVBase and CVReturn gate CVPixelBufferLockBaseAddress, which the capture-fill check reads through.
	"CVBase",
	"CVBuffer",
	"CVReturn",
	"CVImageBuffer",
	"CVPixelBuffer",
	"CVPixelBufferIOSurface",
	"objc2-io-surface",
] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = [
	"IOSurfaceRef",
	# IOSurfaceTypes and libc gate IOSurfaceLock, which the capture copy (`own_copy` in
	# snapshot_service.rs) needs to read the pool's surface and write ours.
	"IOSurfaceTypes",
	"libc",
	"objc2",
	"objc2-core-foundation",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
	"SCScreenshotManager",
	"SCShareableContent",
	"SCStream",
	"block2",
	"objc2-core-foundation",
	"objc2-core-graphics",
	"objc2-core-media",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
	# CAShapeLayer masks each tile's shadow to a ring outside the window, so it cannot wash under a
	# translucent one.
	"CAShapeLayer",
	"CAAnimation",
	"CABase",
	"CAEAGLLayer",
	"CAEDRMetadata",
	"CAGradientLayer",
	"CAMediaTimingFunction",
	"CAOpenGLLayer",
	"CARenderer",
	"CATextLayer",
	"CATransaction",
	"objc2-core-foundation",
	"objc2-core-graphics",
	"objc2-metal"
]}

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 16
debug-assertions = true
overflow-checks = true
split-debuginfo = "packed"
panic = "unwind"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
panic = "unwind"
incremental = false
lto = "thin"
strip = true

[profile.release-fast]
inherits = "release"
opt-level = 2
codegen-units = 16
incremental = true
lto = "off"
strip = false

[profile.profiling]
inherits = "release"
strip = false
