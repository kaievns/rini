[env]
# One test thread, on purpose: docs/testing.md, "The test suite runs single-threaded on purpose".
RUST_TEST_THREADS = "1"

# Build through the signing wrapper, so a bare `cargo build` cannot leave the rini binary ad-hoc
# signed. TCC keys the Accessibility grant to the code identity, the launch agent points at the
# build output, and an ad-hoc rebuild costs a re-grant at the next restart. See docs/signing.md.
[build]
rustc-workspace-wrapper = "bin/sign-rustc.sh"
