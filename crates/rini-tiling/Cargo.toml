[package]
name = "rini-tiling"
version = "0.1.0"
edition = "2024"
description = "rini's tiling context: strips of columns of windows, the scrolling layout, and its settings. Pure geometry."
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
rini-core = { workspace = true }
rini-geometry = { workspace = true }
rustc-hash = { workspace = true }
enum_dispatch = { workspace = true }
objc2-core-foundation = { workspace = true }
rini-ipc = { workspace = true }
rini-windows = { workspace = true }
serde = { workspace = true, features = ["derive"] }
slotmap = { workspace = true }
tracing = { workspace = true }
