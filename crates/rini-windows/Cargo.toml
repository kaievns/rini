[package]
name = "rini-windows"
version = "0.1.0"
edition = "2024"
description = "rini's windows context: window and app identity, the window catalogue's records, app rules, and the Accessibility and window-server adapters that observe and drive windows."
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[features]
test-support = []

[dependencies]
rini-mach-sys = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
dispatchr = { workspace = true }
libc = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-application-services = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-foundation = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
rini-ipc = { workspace = true }
rini-runloop = { workspace = true }
rini-shared = { workspace = true }
rini-skylight-sys = { workspace = true }
serde = { workspace = true, features = ["derive"] }
static_assertions = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ron = { workspace = true }
serde_json = { workspace = true }
