[package]
name = "rini-runloop"
version = "0.1.0"
edition = "2024"
description = "The CFRunLoop executor, timers and span-carrying channel every rini actor runs on."
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
continue = { workspace = true }
dispatchr = { workspace = true }
futures-task = { workspace = true }
nix = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-foundation = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
