[package]
name = "rini-core"
version = "0.1.0"
edition = "2024"
description = "Shared kernel for rini: identities, collections, geometry, logging, channels"
license = "Apache-2.0"
publish = false

[dependencies]
libc = "0.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes"] }
rini-protocol = { path = "../rini-protocol" }
rustc-hash = "2.1.1"
serde = { version = "1.0.201", default-features = false, features = ["derive"] }
serde_with = "3.9.0"
tokio = { version = "1.35.1", default-features = false, features = ["sync"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["std", "tracing", "env-filter"], default-features = false }
tracing-timing = "0.7.0"
tracing-tree = { version = "0.4.0", features = ["time"], default-features = false }

[dev-dependencies]
ron = "0.11.0"
serde_json = "1.0.145"
