[package]
name = "rini-displays"
version = "0.1.0"
edition = "2024"
description = "rini's displays context: screens, native spaces, coordinates, which windows sit on which space; the spaces and cursor-warp actors."
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[features]
test-support = []

[dependencies]
dispatchr = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-foundation = { workspace = true }
once_cell = { workspace = true }
rini-runloop = { workspace = true }
rini-shared = { workspace = true }
rini-skylight-sys = { workspace = true }
rini-windows = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["sync", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
rini-windows = { workspace = true, features = ["test-support"] }
