[package]
name = "rini-macos"
version = "0.1.0"
edition = "2024"
description = "macOS platform layer for rini: Accessibility, SkyLight, event taps, run loop, Mach"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
doctest = false

[features]
# Replaces the window-server reads with thread-local overrides so another crate's tests never
# touch the live window server. See docs/testing.md.
test-support = []

[dependencies]
rini-skylight-sys = { workspace = true }
rini-runloop = { workspace = true }
anyhow = { workspace = true }
bitflags = { workspace = true }
clap = { workspace = true }
continue = { workspace = true }
dispatchr = { workspace = true }
futures-task = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
num_enum = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-application-services = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-foundation = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
rini-shared = { workspace = true }
serde = { workspace = true, features = ["derive"] }
static_assertions = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { version = "3.17.1", default-features = false }
