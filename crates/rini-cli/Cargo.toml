[package]
name = "rini-cli"
version = "0.1.0"
edition = "2024"
description = "The command-line client for rini: commands, queries and event subscriptions over the Mach IPC"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rini-cli"
path = "src/main.rs"

[dependencies]
rini-core = { workspace = true }
clap = { workspace = true }
rini-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sigpipe = { workspace = true }
