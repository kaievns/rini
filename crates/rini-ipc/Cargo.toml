[package]
name = "rini-ipc"
version = "0.1.0"
edition = "2024"
description = "rini's IPC context: the command and query language, the Mach server, and the client."
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
rini-core = { workspace = true }
rini-mach-sys = { workspace = true }
thiserror = { workspace = true }
continue = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
ctrlc = "3.5.2"
