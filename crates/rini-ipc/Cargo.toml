[package]
name = "rini-ipc"
version = "0.1.0"
edition = "2024"
description = "rini's Mach IPC server: request dispatch, event subscriptions, CLI hooks"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
rini-displays = { workspace = true }
rini-windows = { workspace = true }
rini-runloop = { workspace = true }
continue = { workspace = true }
crossbeam-channel = { workspace = true }
dashmap = { workspace = true }
nix = { workspace = true }
parking_lot = { workspace = true }
rini-client = { workspace = true }
rini-config = { workspace = true }
rini-macos = { workspace = true }
rini-protocol = { workspace = true }
rini-shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
