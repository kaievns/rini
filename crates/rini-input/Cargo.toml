[package]
name = "rini-input"
version = "0.1.0"
edition = "2024"
description = "rini's input context: keys, bindings, gestures and drags, the CGEventTap adapters that read them, and the commands they turn into."
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
rini-core = { workspace = true }
rini-geometry = { workspace = true }
rustc-hash = { workspace = true }
anyhow = { workspace = true }
arc-swap = "1"
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
rini-ipc = { workspace = true }
rini-runloop = { workspace = true }
rini-skylight-sys = { workspace = true }
rini-windows = { workspace = true }
serde = { workspace = true, features = ["derive"] }
strum = { workspace = true }
strum_macros = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
